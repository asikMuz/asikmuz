<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asik.MUZ — Admin</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #101014;
      color: white;
      font-family: Arial, sans-serif;
    }
    .panel {
      max-width: 400px;
      margin: 40px auto;
      padding: 22px;
      background: #1d1d25;
      border-radius: 16px;
    }
    h2 { color: #b69cff; }
    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      border: 0;
      border-radius: 8px;
    }
    button {
      background: #9b75ff;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>Asik.MUZ Admin</h2>
    <p>Панель управления сайтом</p>
    <p>Скоро здесь появится форма добавления песен.</p>
  </div>
</body>
</html>
