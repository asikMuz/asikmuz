
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asik.MUZ — Тексты песен</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#222;font-family:Arial,sans-serif}
header{padding:22px 7%;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:800;color:#111}
.logo span{color:#e84b72}
nav a{color:#555;text-decoration:none;margin-left:18px}
main{max-width:950px;margin:45px auto;padding:0 20px}
h1{font-size:36px;margin-bottom:10px}
.sub{color:#888;margin-bottom:28px}
.search{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin-bottom:28px}
.song{display:flex;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid #eee}
.cover{width:105px;height:105px;border-radius:12px;object-fit:cover;background:#f1f1f1}
.song h2{margin:0 0 8px;font-size:20px}
.song p{color:#888;margin:0 0 12px}
button{background:#111;color:white;border:0;padding:10px 17px;border-radius:8px;cursor:pointer}
#lyrics{display:none;white-space:pre-line;line-height:1.9;padding:20px 0;color:#444}
footer{text-align:center;color:#999;padding:35px 10px}
@media(max-width:600px){
header{padding:18px 5%}.logo{font-size:23px}
nav a{margin-left:8px;font-size:13px}
h1{font-size:29px}.cover{width:85px;height:85px}
}
</style>
</head>
<body>
<header>
  <div class="logo">Asik<span>.</span>MUZ</div>
  <nav><a href="#">Главная</a></nav>
</header>

<main>
  <h1>Тексты песен</h1>
  <p class="sub">Находи тексты своих любимых песен.</p>

  <input class="search" id="search"
  placeholder="Поиск песни или исполнителя...">

  <div id="songs"></div>
  <div id="lyrics"></div>
</main>

<footer>© 2026 Asik.MUZ</footer>

<script>
const data = [
  {
    title: "Первая песня",
    artist: "Исполнитель",
    image: "",
    lyrics: "Добавь сюда текст своей песни."
  },
  {
    title: "Вторая песня",
    artist: "Исполнитель",
    image: "",
    lyrics: "Добавь сюда текст второй песни."
  }
];

const songs = document.getElementById("songs");
const lyrics = document.getElementById("lyrics");

function render(list) {
  songs.innerHTML = "";
  list.forEach(song => {
    const item = document.createElement("div");
    item.className = "song";

    const img = document.createElement("img");
    img.className = "cover";
    img.alt = "Обложка песни";
    img.src = song.image || "https://placehold.co/200x200/f4f4f4/777?text=MUZ";

    const info = document.createElement("div");
    const title = document.createElement("h2");
    title.textContent = song.title;
    const artist = document.createElement("p");
    artist.textContent = song.artist;
    const btn = document.createElement("button");
    btn.textContent = "Читать текст";
    btn.onclick = () => {
      lyrics.style.display = "block";
      lyrics.textContent = song.title + "\n" +
        song.artist + "\n\n" + song.lyrics;
      lyrics.scrollIntoView({behavior:"smooth"});
    };

    info.append(title, artist, btn);
    item.append(img, info);
    songs.append(item);
  });
}

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  render(data.filter(s =>
    s.title.toLowerCase().includes(q) ||
    s.artist.toLowerCase().includes(q)
  ));
});

render(data);
</script>
</body>
</html>
